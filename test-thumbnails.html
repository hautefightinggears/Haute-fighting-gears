<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .id {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <h1>TikTok Thumbnail Test - All 33 Videos</h1>
    <p>Green = Loaded Successfully | Red = Failed to Load</p>
    <div class="grid" id="grid"></div>

    <script>
        const videos = [
            "7660943445753711879", "7660576982807317778", "7658401774608321810", "7657966813535309064",
            "7657203287581658376", "7656098215850167559", "7655385151437835527", "7654284985750293768",
            "7653522653877259538", "7652411601416457479", "7651634148427173128", "7650163947114466567",
            "7649424144706096392", "7648701801868397842", "7648022991183301895", "7647557681149922578",
            "7647557240831937810", "7614907011037252880", "7614903550254288135", "7606755653570383111",
            "7591911344979578132", "7591559800664689941", "7590375468776443157", "7587714606559268117",
            "7551485229777685761", "7542952386160086273", "7664635786934914311", "7664260559977696519",
            "7663522119250185479", "7662769950439869704", "7663137486910049554", "7665014657022725394",
            "7665778085291199751"
        ];

        const grid = document.getElementById('grid');

        videos.forEach((id, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            const img = document.createElement('img');
            img.src = `assets/images/tiktok-thumbnails/tiktok-${id}.webp`;

            const status = document.createElement('div');
            status.textContent = 'Loading...';

            const idDiv = document.createElement('div');
            idDiv.className = 'id';
            idDiv.textContent = `#${index + 1}: ${id}`;

            img.onload = () => {
                status.textContent = '✓ Loaded';
                status.className = 'success';
            };

            img.onerror = () => {
                status.textContent = '✗ Failed';
                status.className = 'error';
            };

            card.appendChild(img);
            card.appendChild(status);
            card.appendChild(idDiv);
            grid.appendChild(card);
        });
    </script>
</body>

</html>
