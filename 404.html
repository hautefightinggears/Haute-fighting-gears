<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Haute Fighting Gears</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <script>
        // GitHub Pages clean URL support
        // Redirect /about → /about/ so folder index.html is served
        (function () {
            var path = window.location.pathname;
            // Already ends with / — real 404
            if (path.slice(-1) === '/') return;
            // Try adding trailing slash (folder routing)
            window.location.replace(path + '/' + window.location.search + window.location.hash);
        })();
    </script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #FBF9F9;
            color: #1b1b1b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .wrap {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 96px;
            font-weight: 900;
            margin: 0 0 8px;
            letter-spacing: 0.02em;
        }

        h2 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0 0 24px;
        }

        p {
            color: #707070;
            margin: 0 0 32px;
            font-size: 16px;
        }

        a {
            display: inline-block;
            background: #E10600;
            color: #fff;
            padding: 14px 32px;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-size: 13px;
        }

        a:hover {
            background: #000;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a href="/">Back to Home</a>
    </div>
</body>

</html>
